<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Grand Theatre | Choose your seats</title>
</head>
<body>

  <header class="site-header">
    <h1>Grand Theatre</h1>
    <p>Select a seat to inspect its details, then add it to your cart.</p>
  </header>

  <main class="layout">
    <section class="map-area" aria-label="Venue map">

      <ul class="legend" aria-label="Seat legend">
        <li><span class="legend-box cat-orchestra"></span> Orchestra</li>
        <li><span class="legend-box cat-side"></span> Side</li>
        <li><span class="legend-box cat-balcony"></span> Balcony</li>
        <li><span class="legend-box state-in-cart"></span> In cart</li>
        <li><span class="legend-box state-unavailable"></span> Unavailable</li>
      </ul>

      <div class="controls" role="group" aria-label="Map controls">
        <button type="button" id="zoomIn"  aria-label="Zoom in">+</button>
        <button type="button" id="zoomOut" aria-label="Zoom out">−</button>
        <button type="button" id="moveUp"    aria-label="Move up">↑</button>
        <button type="button" id="moveDown"  aria-label="Move down">↓</button>
        <button type="button" id="moveLeft"  aria-label="Move left">←</button>
        <button type="button" id="moveRight" aria-label="Move right">→</button>
        <button type="button" id="resetView">Reset view</button>
      </div>

      <div id="viewport">
        <div id="map">

          <div class="stage">Stage</div>

          <div id="hall">

            <section class="zone" id="zone-left"    aria-label="Left side"></section>
            <section class="zone" id="zone-center"  aria-label="Orchestra"></section>
            <section class="zone" id="zone-right"   aria-label="Right side"></section>
            <section class="zone" id="zone-balcony" aria-label="Balcony"></section>
          </div>

        </div>
      </div>
    </section>

    <aside class="side">
      <section class="panel" aria-labelledby="details-title">
        <h2 id="details-title">Seat details</h2>
        <div id="details" aria-live="polite">
          <p class="empty">No seat selected. Click a seat on the map.</p>
        </div>
        <button type="button" id="addBtn">Add to cart</button>
      </section>

      <section class="panel" aria-labelledby="cart-title">
        <h2 id="cart-title">Your cart</h2>
        <ul id="cartList" aria-live="polite">
          <!-- Cart items will be generated by script.js -->
        </ul>
        <p class="empty" id="cartEmpty">Your cart is empty.</p>
        <p class="total">Total: <strong id="total">$0</strong></p>
        <button type="button" id="clearBtn">Clear cart</button>
      </section>
    </aside>
  </main>
</body>
</html>
